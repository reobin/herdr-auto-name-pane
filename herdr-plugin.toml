id = "reobin.auto-name-pane"
name = "Auto-name pane"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Assign a unique easy label to every new pane; resolve labels to pane IDs for agents"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "scripts/name-unnamed.sh"]

[[events]]
on = "pane.created"
command = ["sh", "scripts/name-one.sh"]

[[actions]]
id = "install-skill"
title = "Install agent skill"
description = "Copy SKILL.md into this machine's agent skill directories"
command = ["sh", "install-skill.sh"]
