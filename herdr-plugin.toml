id = "reobin.auto-name-pane"
name = "Auto-name pane"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Label every new pane with a short name, and teach agents to resolve those labels to pane IDs"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "scripts/name.sh"]

[[events]]
on = "pane.created"
command = ["sh", "scripts/name.sh"]

[[actions]]
id = "install-skill"
title = "Install agent skill"
description = "Copy the herdr-auto-name-pane skill into this machine's agent skill directories"
command = ["sh", "install-skill.sh"]
